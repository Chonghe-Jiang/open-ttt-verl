run:
  output_dir: outputs/guidance_ttt/erdos_gpt_oss_20b_5step
  project_name: guidance_ttt
  experiment_name: erdos_qwen8b_actor_gpt_oss_exec_5step
  # Trainable guidance actor. gpt-oss-20b is used below as the local execution model.
  model_path: Qwen/Qwen3-8B
  seed: 0
  num_initial_states: 1
  num_steps: 5
  total_epochs: 5
  max_prompt_length: 4096
  max_response_length: 1024
  learning_rate: 1.0e-5
  ppo_mini_batch_size: 1
  ppo_micro_batch_size_per_gpu: 1
  use_kl_loss: true
  kl_loss_coef: 0.05
  rollout_engine: vllm
  tensor_model_parallel_size: 2
  gpu_memory_utilization: 0.20
  n_gpus_per_node: 2
  nnodes: 1
  save_freq: -1
  test_freq: -1
  val_before_train: false
  prepare_only: false

ttt:
  groups_per_batch: 1
  group_size: 2
  eval_timeout: 60
  puct_c: 1.0

llm:
  execution:
    provider: local
    model: models/gpt-oss-20b
    device_map: auto
    torch_dtype: auto
    trust_remote_code: true
    reasoning_effort: low
    temperature: 0.2
    top_p: 0.95
    max_tokens: 2048

verl_overrides:
  - actor_rollout_ref.model.lora_rank=32
  - actor_rollout_ref.model.lora_alpha=32
  - actor_rollout_ref.rollout.load_format=auto
  - actor_rollout_ref.rollout.free_cache_engine=True
  - actor_rollout_ref.rollout.layered_summon=True
  - actor_rollout_ref.model.enable_gradient_checkpointing=True
  - actor_rollout_ref.actor.fsdp_config.model_dtype=bfloat16
  - actor_rollout_ref.actor.fsdp_config.param_offload=True
  - actor_rollout_ref.actor.fsdp_config.optimizer_offload=True
  - actor_rollout_ref.ref.fsdp_config.model_dtype=bfloat16
  - actor_rollout_ref.ref.fsdp_config.param_offload=True
  - actor_rollout_ref.rollout.agent.num_workers=1
  - actor_rollout_ref.rollout.max_model_len=4096
  - actor_rollout_ref.rollout.max_num_seqs=4
  - actor_rollout_ref.rollout.max_num_batched_tokens=4096
  - actor_rollout_ref.rollout.enforce_eager=True
  - actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=1
  - actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=1
  - actor_rollout_ref.rollout.checkpoint_engine.update_weights_bucket_megabytes=4096
