run:
  output_dir: outputs/guidance_ttt/polyomino_gpt_oss_20b_8gpu_50step
  project_name: guidance_ttt
  experiment_name: polyomino_qwen8b_actor_gpt_oss_exec_8gpu_50step
  model_path: /work/mit/ppliang_mit/lsy/models/Qwen3-8B
  seed: 0
  num_initial_states: 1
  num_steps: 50
  total_epochs: 50
  max_prompt_length: 8192
  max_response_length: 4096
  learning_rate: 4.0e-5
  ppo_mini_batch_size: 8
  ppo_micro_batch_size_per_gpu: 1
  use_kl_loss: true
  kl_loss_coef: 0.05
  rollout_engine: vllm
  tensor_model_parallel_size: 8
  gpu_memory_utilization: 0.12
  n_gpus_per_node: 8
  nnodes: 1
  save_freq: 5
  test_freq: -1
  val_before_train: false
  prepare_only: false

task:
  id: polyomino_packing
  frontiercs:
    base_dir: /work/mit/ppliang_mit/lsy/reference/Frontier-CS
    problem_id: "0"
    n_cases: 70
    time_limit_s: 2
    memory_mb: 256
    total_timeout_s: 340

ttt:
  groups_per_batch: 8
  group_size: 32
  eval_timeout: 340
  puct_c: 1.0

llm:
  execution:
    provider: local_vllm
    model: models/gpt-oss-20b
    dtype: auto
    trust_remote_code: true
    reasoning_effort: low
    temperature: 0.35
    top_p: 0.95
    max_tokens: null
    phase1_max_tokens: null
    tensor_model_parallel_size: 8
    gpu_memory_utilization: 0.35
    enforce_eager: true
    max_num_seqs: 8
    max_batch_size: 8
    batch_wait_ms: 50
    max_model_len: 32768

verl_overrides:
  - actor_rollout_ref.model.lora_rank=32
  - actor_rollout_ref.model.lora_alpha=32
  - actor_rollout_ref.rollout.load_format=auto
  - actor_rollout_ref.rollout.free_cache_engine=True
  - actor_rollout_ref.rollout.layered_summon=True
  - actor_rollout_ref.model.enable_gradient_checkpointing=True
  - actor_rollout_ref.actor.fsdp_config.model_dtype=bfloat16
  - actor_rollout_ref.actor.fsdp_config.param_offload=True
  - actor_rollout_ref.actor.fsdp_config.optimizer_offload=True
  - actor_rollout_ref.ref.fsdp_config.model_dtype=bfloat16
  - actor_rollout_ref.ref.fsdp_config.param_offload=True
  - actor_rollout_ref.rollout.agent.num_workers=1
  - actor_rollout_ref.rollout.max_model_len=8192
  - actor_rollout_ref.rollout.max_num_seqs=8
  - actor_rollout_ref.rollout.max_num_batched_tokens=8192
  - actor_rollout_ref.rollout.enforce_eager=True
  - actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=1
  - actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=1
  - actor_rollout_ref.rollout.checkpoint_engine.update_weights_bucket_megabytes=2048
