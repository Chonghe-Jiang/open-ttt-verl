run:
  output_dir: /runs/guidance_ttt/polyomino_modal_h200_2gpu_single_summary
  project_name: guidance_ttt
  experiment_name: polyomino_qwen8b_actor_gpt_oss_exec_modal_h200_2gpu_single_summary
  model_path: Qwen/Qwen3-8B
  seed: 0
  num_initial_states: 1
  num_steps: 1
  total_epochs: 1
  max_prompt_length: 8192
  max_response_length: 24576
  learning_rate: 4.0e-5
  ppo_mini_batch_size: 1
  ppo_micro_batch_size_per_gpu: 1
  use_kl_loss: true
  kl_loss_coef: 0.05
  rollout_engine: vllm
  tensor_model_parallel_size: 2
  gpu_memory_utilization: 0.12
  n_gpus_per_node: 2
  nnodes: 1
  save_freq: -1
  test_freq: -1
  val_before_train: false
  prepare_only: false
  hf_cache_dir: /cache/huggingface
  ray_temp_dir: /tmp/ray
  tmp_dir: /tmp/guidance-ttt-tmp
  triton_cache_dir: /cache/triton

task:
  id: polyomino_packing
  frontiercs:
    base_dir: /opt/Frontier-CS
    judge_url: http://127.0.0.1:8081
    problem_id: "0"
    n_cases: 70
    time_limit_s: 2
    memory_mb: 256
    total_timeout_s: 340

ttt:
  groups_per_batch: 1
  group_size: 2
  eval_timeout: 340
  puct_c: 1.0
  bootstrap:
    enabled: true
    required: true
    max_attempts: 2
    overwrite_existing: false

llm:
  execution:
    provider: local_vllm
    model: openai/gpt-oss-20b
    dtype: auto
    trust_remote_code: true
    reasoning_effort: low
    temperature: 0.35
    top_p: 0.95
    max_tokens: null
    phase1_max_tokens: null
    tensor_model_parallel_size: 2
    gpu_memory_utilization: 0.35
    enforce_eager: true
    max_num_seqs: 1
    max_batch_size: 1
    batch_wait_ms: 50
    max_model_len: 32768
    download_dir: /cache/huggingface/hub

verl_overrides:
  - +actor_rollout_ref.model.override_config.attn_implementation=sdpa
  - actor_rollout_ref.model.lora_rank=32
  - actor_rollout_ref.model.lora_alpha=32
  - actor_rollout_ref.rollout.load_format=auto
  - actor_rollout_ref.rollout.free_cache_engine=True
  - actor_rollout_ref.rollout.layered_summon=True
  - actor_rollout_ref.model.enable_gradient_checkpointing=True
  - actor_rollout_ref.actor.fsdp_config.model_dtype=bfloat16
  - actor_rollout_ref.actor.fsdp_config.param_offload=True
  - actor_rollout_ref.actor.fsdp_config.optimizer_offload=True
  - actor_rollout_ref.ref.fsdp_config.model_dtype=bfloat16
  - actor_rollout_ref.ref.fsdp_config.param_offload=True
  - actor_rollout_ref.rollout.agent.num_workers=1
  - actor_rollout_ref.rollout.max_model_len=32768
  - actor_rollout_ref.rollout.max_num_seqs=1
  - actor_rollout_ref.rollout.max_num_batched_tokens=32768
  - actor_rollout_ref.rollout.enforce_eager=True
  - actor_rollout_ref.actor.use_torch_compile=False
  - actor_rollout_ref.actor.fsdp_config.use_torch_compile=False
  - actor_rollout_ref.ref.use_torch_compile=False
  - actor_rollout_ref.ref.fsdp_config.use_torch_compile=False
  - actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=1
  - actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=1
  - actor_rollout_ref.rollout.checkpoint_engine.update_weights_bucket_megabytes=2048
  - +ray_kwargs.ray_init.runtime_env.env_vars.TORCHDYNAMO_DISABLE='1'
